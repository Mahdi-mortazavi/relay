# Relay pins every dependency (android/gradle/libs.versions.toml, the .csproj
# PackageReferences, and the actions in .github/workflows). Dependabot keeps
# those pins honest — a stale pin is a security problem, not a stable one.
#
# Everything is grouped: ten single-dependency branches a week is noise, and
# these updates are only ever verified together anyway (the toolchain upgrade in
# docs/backlog.md is exactly one bump dragging four others with it).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      android-dependencies:
        patterns: ['*']
    # Kotlin 2.4.20 specifically, and nothing else.
    #
    # CodeQL's Kotlin extractor refuses it -- "Kotlin version 2.4.20 is too
    # recent. CodeQL currently supports versions below 2.4.20" -- so the bump
    # lands as a permanently red pull request while the app itself builds and
    # tests clean on it. A red Dependabot branch nobody can merge is worse than
    # a held pin: it teaches everyone to ignore a failing check.
    #
    # Pinned to the one version rather than a range on purpose. When 2.4.21
    # appears Dependabot will raise it, and that run answers the only question
    # that matters -- whether CodeQL has caught up -- without anyone having to
    # remember this file exists.
    #
    # The pattern matters, and the first attempt at it did not work. It was
    # `org.jetbrains.kotlin:*`, which is the Maven `group:artifact` form -- and
    # Dependabot names Gradle *plugins* by their plugin id, which has no colon
    # in it at all. Its own pull request said so:
    #
    #   Updates `org.jetbrains.kotlin.plugin.compose` from 2.4.10 to 2.4.20
    #
    # So the rule matched nothing and #162 arrived with the same bump. Both
    # forms are listed below: the plugin ids this catalogue actually uses, and
    # the coordinate form in case a Kotlin artifact is ever depended on
    # directly.
    ignore:
      - dependency-name: org.jetbrains.kotlin.plugin.*
        versions: ['2.4.20']
      - dependency-name: org.jetbrains.kotlin:*
        versions: ['2.4.20']

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      windows-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
