# The device lab (docs/testing.md → "Automated device lab").
#
# GitHub provisions everything: an Android emulator built from scratch on every
# run, and a clean Windows machine. Nothing here depends on a maintainer's
# hardware, and nothing is mocked at the transport layer — the tests drive the
# real APK and the real installer, and push real bytes through the real SOCKS5
# server.
#
# Three jobs:
#   android-device  the golden user journey on a real Android image
#   cross-platform  the Windows-side client against a live phone, over adb
#   windows-app     the real installer: install, launch, restore, uninstall
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full Mode's forwarder, built once and handed to every job that installs the
  # app. Built here rather than downloaded from the CI workflow because a job
  # must not depend on another *workflow* having run: the APK these tests
  # exercise has to contain the same library the release will ship, or the lab
  # proves the mode works in a build nobody gets.
  wg-library:
    name: Full Mode library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Build it
        run: scripts/build-wg-aar.sh

      - uses: actions/upload-artifact@v7
        with:
          name: relaywg-aar-e2e
          path: android/app/libs/relaywg.aar
          if-no-files-found: error

  # The endpoint itself, on Android. The Go job runs this suite against glibc on
  # the runner; this runs the same binary, cross-compiled for bionic, on a real
  # Android image. Full Mode is the one part of Relay that is almost entirely
  # system calls — raw UDP, a userspace network stack, sockets dialled out of it
  # — and "it works on Linux" is not what anyone downloads the app for.
  wg-on-device:
    name: Full Mode endpoint (on a device)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cross-compile the suite for Android
        working-directory: wg
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          # CGO is not optional here: without it Go cannot use bionic's
          # resolver, and the build would not be the one that ships.
          export CGO_ENABLED=1
          export CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          test -x "$CC" || { echo "::error::No NDK clang at $CC"; exit 1; }
          GOOS=android GOARCH=amd64 go test -c -o "$RUNNER_TEMP/relaywg.test" .
          ls -l "$RUNNER_TEMP/relaywg.test"

      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/wg-device-test.sh "${{ runner.temp }}/relaywg.test" "${{ github.workspace }}/e2e-out"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-wg-on-device
          path: e2e-out/**
          if-no-files-found: warn

  # Full Mode's Windows half, on a real Windows machine.
  #
  # This is the only job in the lab that creates a network adapter. Everything
  # about the client that can fail only on Windows lives here: WinTun needs
  # Administrator, the address and metric and routes are Windows APIs, and the
  # teardown has to leave the machine's networking as it found it.
  windows-full-mode:
    name: Full Mode client (WinTun adapter)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Build the client
        working-directory: wg
        # Its own directory: wintun.dll has to sit beside the executable, which
        # is also how it will sit beside Relay.exe once installed.
        run: go build -o "${{ runner.temp }}/client/relaywg-client.exe" ./cmd/relaywg-client

      # wintun.dll is not linked in: the library loads it at runtime from the
      # executable's own directory, which is also how it will sit next to
      # Relay.exe once installed.
      - name: Fetch WinTun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          # Pinned by hash: this DLL ends up inside the installer, and a
          # silently changed build of it is a supply-chain problem, not an
          # inconvenience.
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "wintun.zip hash is $actual, expected $expected"
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" "$env:RUNNER_TEMP\client\wintun.dll"
          Get-Item "$env:RUNNER_TEMP\client\wintun.dll" | Format-List Name, Length

      - name: Bring up a real adapter and route through it
        working-directory: wg
        shell: pwsh
        env:
          RELAYWG_CLIENT: ${{ runner.temp }}\client\relaywg-client.exe
        run: |
          $ErrorActionPreference = 'Stop'
          # Named so a failure to create the adapter can be read as "not
          # elevated" rather than guessed at.
          $admin = ([Security.Principal.WindowsPrincipal] `
            [Security.Principal.WindowsIdentity]::GetCurrent()
          ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as Administrator: $admin"
          Get-ChildItem (Split-Path $env:RELAYWG_CLIENT) | Format-Table Name, Length
          go test -count=1 -v -timeout 15m ./cmd/relaywg-client

      - name: The machine's networking must be as we found it
        if: always()
        shell: pwsh
        run: |
          $left = Get-NetAdapter -Name 'RelayTest' -ErrorAction SilentlyContinue
          if ($left) {
            Write-Error "The test left an adapter behind: $($left.Name)"
          }
          Write-Host "No Relay adapters remain."

  android-device:
    name: Android device (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: wg-library
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_relayRequireWg: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two levels that behave differently in ways Relay depends on, rather
          # than a wide matrix that costs CI time and proves little:
          #   30 — no POST_NOTIFICATIONS, no typed foreground services
          #   34 — runtime notification permission + specialUse FGS type
          - api: 30
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Take the Full Mode library
        uses: actions/download-artifact@v4
        with:
          name: relaywg-aar-e2e
          path: android/app/libs

      # Without KVM the emulator falls back to software rendering and the job
      # times out instead of testing anything.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-${{ matrix.target }}

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/device-tests.sh "${{ github.workspace }}/e2e-out"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-api${{ matrix.api }}
          path: |
            e2e-out/**
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  # The universal APK exists for devices the arm64 split cannot reach: 32-bit ARM
  # phones, x86 Chromebooks, emulators. Publishing it without ever installing it
  # somewhere non-arm64 would be publishing a promise, so this job installs the
  # real minified release APK on an x86_64 emulator, drives it through its own UI
  # and pushes real bytes through its proxy.
  universal-apk:
    name: Universal APK (x86_64 device)
    runs-on: ubuntu-latest
    needs: wg-library
    timeout-minutes: 45
    # Applies to every Gradle call in the job, including the ones inside the
    # scripts, so a missing Full Mode library fails here instead of quietly
    # producing an APK the lab then declares fit to ship.
    env:
      ORG_GRADLE_PROJECT_relayRequireWg: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Take the Full Mode library
        uses: actions/download-artifact@v4
        with:
          name: relaywg-aar-e2e
          path: android/app/libs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Release, so R8 actually runs: a missing keep rule is invisible in a
      # debug build and fatal in the one people download.
      - name: Build the universal release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # No release keystore on a pull request, and adb will not install an
      # unsigned APK. Sign the real minified output with a throwaway key so the
      # artifact under test stays the release build rather than becoming a debug
      # one — the signature is not what this job is testing.
      - name: Sign it for the device
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*universal*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No universal APK was produced."
            find android/app/build/outputs/apk/release -name '*.apk' || true
            exit 1
          fi
          if unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "Already signed by the release config; using it as-is."
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/e2e.jks" -storepass e2epass \
              -keypass e2epass -alias e2e -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=Relay E2E, O=CI, C=US" >/dev/null 2>&1
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/e2e.jks" --ks-pass pass:e2epass \
              --key-pass pass:e2epass --out "$RUNNER_TEMP/universal-signed.apk" "$APK"
            APK="$RUNNER_TEMP/universal-signed.apk"
          fi
          echo "UNIVERSAL_APK=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"

      - name: Install and exercise it on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/universal-apk-e2e.sh "$UNIVERSAL_APK" "${{ github.workspace }}/e2e-out"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-universal-apk
          path: e2e-out/**
          if-no-files-found: warn

  cross-platform:
    name: Cross-platform (host client ↔ live phone)
    runs-on: ubuntu-latest
    needs: wg-library
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_relayRequireWg: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Take the Full Mode library
        uses: actions/download-artifact@v4
        with:
          name: relaywg-aar-e2e
          path: android/app/libs

      # The host half of this test is the Windows client's own code.
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test APK
        working-directory: android
        # The x86_64 split the emulator needs; see android/app/build.gradle.kts.
        # Set as an environment property so it cannot drift from the value the
        # emulator script uses when it rebuilds.
        env:
          ORG_GRADLE_PROJECT_relayTestAbis: 'true'
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Restore the host client
        run: dotnet restore windows/Relay.E2E.Tests/Relay.E2E.Tests.csproj

      - name: Host client against a live phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/install-and-cross-test.sh "${{ github.workspace }}/e2e-out"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cross-platform
          path: e2e-out/**
          if-no-files-found: warn

  windows-app:
    name: Windows app (installer → launch → uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Publish the app (x64, self-contained)
        shell: pwsh
        run: |
          $proj = "windows/Relay.App/Relay.App.csproj"
          $pub = "$env:GITHUB_WORKSPACE\publish-x64"
          $props = "/p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true"
          msbuild $proj /restore /t:Build /v:minimal $props.Split(' ')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          msbuild $proj /t:Publish /v:minimal $props.Split(' ') /p:PublishDir="$pub\"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$pub\resources.pri")) {
            $bin = "windows/Relay.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
            $pri = Get-ChildItem $bin -Filter resources.pri -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($pri) { Copy-Item $pri.FullName "$pub\resources.pri" }
          }
          if (-not (Test-Path "$pub\resources.pri")) {
            Write-Error "resources.pri missing - the app would crash at launch."
            exit 1
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=0.0.0-e2e /DAppPlatform=x64 `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish-x64" windows/installer/relay.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, launch, restore, uninstall
        # Windows PowerShell, not pwsh: the evidence screenshot needs WinForms.
        shell: powershell
        run: .\.github\scripts\windows-app-e2e.ps1 -EvidenceDir "$env:GITHUB_WORKSPACE\e2e-out"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: e2e-out/**
          if-no-files-found: warn
