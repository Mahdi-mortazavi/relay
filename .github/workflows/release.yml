# The release pipeline: one tag, one release, both platforms.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# builds the signed Android artifacts and both Windows installers, publishes
# them as a single GitHub Release with checksums, and leaves
# /releases/latest/download/<asset> resolving for every platform — which is what
# the README download buttons point at.
#
# This is the only way to publish. The per-platform workflows that used to sit
# beside it (android-release.yml, windows-release.yml) were deleted, because
# what they actually did was ship a *different app* under a similar name: the
# Android one never built the Full Mode library and never passed
# -PrelayRequireWg, so it could publish a signed release offering a mode that
# could not start, and it emitted no universal APK at all. Worse, a release
# under a tag like `android-v1.7.1` is not semver, so GitHub could hand it the
# "Latest" title — at which point every README download link, which points at
# /releases/latest/download/<asset>, 404s.
#
# Two users comparing "the universal APK" against "the arm64 APK" in August 2026
# were, without any way to tell, comparing artifacts from different releases.
# One publishing path is the fix for that.
#
# workflow_dispatch builds the same artifacts. Leave `publish` off for a dry
# run; turn it on to cut the release without pushing a tag first — `gh release
# create` creates the tag itself, which is also the only route available from
# environments where pushing tags is blocked.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release (otherwise artifacts only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.0.0-dry-run' }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish || false }}" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Full Mode's forwarder is built here rather than pulled from another
      # job's artifact: what ships has to come from the tagged commit, and an
      # artifact is a promise about a different run.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Build the Full Mode library
        working-directory: .
        run: scripts/build-wg-aar.sh

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — see docs/release.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.pfx"

      # ci.yml runs on branches and pull requests, so a tag push matches none of
      # its filters: before this, `git push origin v1.8.0` built and published
      # without a single test having run on that commit. The suites are a minute
      # and they are the ones that assert the two platforms agree.
      # testDebugUnitTest, not testReleaseUnitTest: AGP 9 does not generate a
      # unit-test task for a minified variant, and the suites are variant-
      # independent — ci.yml runs exactly this task.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PrelayRequireWg=true

      - name: Build signed APK and AAB
        env:
          RELAY_KEYSTORE_FILE: ${{ runner.temp }}/release.pfx
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # -PrelayRequireWg: a release that quietly lacks Full Mode while the app
        # still offers it in the UI is the exact failure this guard exists for.
        run: ./gradlew assembleRelease bundleRelease -PrelayVersion=${{ needs.version.outputs.version }} -PrelayRequireWg=true

      - name: Collect artifacts
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p ../dist
          # Match the ABI explicitly: a bare `head -1` would happily publish a
          # different split under the arm64 name.
          APK=$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No arm64-v8a release APK was produced; refusing to publish."
            find app/build/outputs/apk/release -name '*.apk' || true
            exit 1
          fi
          # The fallback for every device the arm64 split cannot install on.
          # Verified on an x86_64 emulator by the universal-apk E2E job before it
          # ever gets here, so a missing one is a real failure, not a nicety.
          UNIVERSAL=$(find app/build/outputs/apk/release -name '*universal*.apk' | head -1)
          if [ -z "$UNIVERSAL" ]; then
            echo "::error::No universal release APK was produced; refusing to publish."
            find app/build/outputs/apk/release -name '*.apk' || true
            exit 1
          fi
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          # Deliberately unversioned: /releases/latest/download/<name> only
          # resolves a fixed filename, and that permalink is what the README
          # download buttons use. The version lives in the release title, the
          # notes, and the app itself.
          cp "$APK" "../dist/Relay-android-arm64-v8a.apk"
          cp "$UNIVERSAL" "../dist/Relay-android-universal.apk"
          cp "$AAB" "../dist/Relay-android.aab"
          ls -la ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # Same reasoning as the Android job: a tag push does not trigger ci.yml,
      # so without this the installers ship untested.
      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test windows/Relay.App.Tests/Relay.App.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish x64 and x86 (self-contained)
        shell: pwsh
        run: |
          $proj = "windows/Relay.App/Relay.App.csproj"
          # Stamp the tag into the assembly. Without this the SDK defaults to
          # 1.0.0.0 and the app's diagnostic report tells every user -- and
          # every bug report -- a version that has never existed.
          $ver = "${{ needs.version.outputs.version }}"
          foreach ($arch in @('x64', 'x86')) {
            $pub = "$env:GITHUB_WORKSPACE\publish-$arch"
            $props = "/p:Configuration=Release /p:Platform=$arch /p:RuntimeIdentifier=win-$arch /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:Version=$ver"
            # Build before Publish: the MRT PRI generation that produces
            # resources.pri only runs on Build, and the window fails to load
            # without it.
            msbuild $proj /restore /t:Build /v:minimal $props.Split(' ')
            if ($LASTEXITCODE -ne 0) { exit 1 }
            msbuild $proj /t:Publish /v:minimal $props.Split(' ') /p:PublishDir="$pub\"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if (-not (Test-Path "$pub\resources.pri")) {
              $bin = "windows/Relay.App/bin/$arch/Release/net8.0-windows10.0.19041.0/win-$arch"
              $pri = Get-ChildItem $bin -Filter resources.pri -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($pri) { Copy-Item $pri.FullName "$pub\resources.pri" }
            }
            if (-not (Test-Path "$pub\resources.pri")) {
              Write-Error "resources.pri missing for $arch - the app would crash at launch."
              exit 1
            }
            # Prove the stamp landed. This is the check that would have caught
            # seven releases of "App: 1.0.0", and it costs one line.
            $stamped = (Get-Item "$pub\Relay.App.dll").VersionInfo.ProductVersion
            if ($stamped -notlike "$ver*") {
              Write-Error "Relay.App.dll says '$stamped' but the tag says '$ver'."
              exit 1
            }
            Write-Host "$arch stamped as $stamped"
          }

      # Full Mode's tunnel process, and the driver library it loads. Both go
      # into the publish directory, which is what the installer packages, so
      # they land beside Relay.exe -- wintun.dll is loaded from the executable's
      # own directory, so the three travel together or Full Mode is not there.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Build the Full Mode client and bundle WinTun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          # Pinned: this DLL ships inside the installer, so a silently changed
          # build of it is a supply-chain problem rather than an inconvenience.
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "wintun.zip hash is $actual, expected $expected" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force

          # amd64 for the x64 installer, x86 for the 32-bit one: a mismatched
          # DLL fails at load with a message about the file being invalid,
          # which reads as a corrupt download rather than a wrong build.
          $targets = @{ 'x64' = @{ goarch = 'amd64'; dll = 'amd64' }
                        'x86' = @{ goarch = '386';   dll = 'x86'   } }
          foreach ($arch in $targets.Keys) {
            $out = "$env:GITHUB_WORKSPACE\publish-$arch"
            $env:GOOS = 'windows'
            $env:GOARCH = $targets[$arch].goarch
            Push-Location wg
            go build -o "$out\relaywg-client.exe" ./cmd/relaywg-client
            if ($LASTEXITCODE -ne 0) { Pop-Location; Write-Error "building the client for $arch failed" }
            Pop-Location
            Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\$($targets[$arch].dll)\wintun.dll" "$out\wintun.dll" -Force
            # A release whose Full Mode is quietly absent is the failure this
            # whole feature already had once, on Android.
            foreach ($file in 'relaywg-client.exe', 'wintun.dll') {
              if (-not (Test-Path "$out\$file")) { Write-Error "$file is missing from publish-$arch" }
            }
            Get-Item "$out\relaywg-client.exe", "$out\wintun.dll" | Format-Table Name, Length
          }

      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          foreach ($arch in @('x64', 'x86')) {
            & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
                    "/DAppPlatform=$arch" `
                    "/DSourceDir=$env:GITHUB_WORKSPACE\publish-$arch" `
                    windows\installer\relay.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem windows\installer\output\*.exe | ForEach-Object {
            # Unversioned, so /releases/latest/download/ resolves (see the
            # Android job for why).
            Copy-Item $_.FullName "dist\Relay-Setup-$($_.BaseName.Split('-')[2]).exe"
          }
          Get-ChildItem dist

      # Authenticode signing. Wired end to end and fully automatic: the moment a
      # certificate lands in the two secrets below, every release is signed with
      # no further change here.
      #
      # It is deliberately a no-op when the secrets are absent rather than a
      # failure, because unsigned distribution is the project's documented,
      # honest status quo (docs/release.md, SECURITY.md) and SHA256SUMS.txt is
      # the integrity story until that changes. What it will NOT do is
      # self-sign: a self-signed binary still trips SmartScreen and would only
      # make an unsigned build look signed.
      - name: Sign the installers
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "::warning::No WINDOWS_CERT_BASE64 secret - shipping unsigned installers. SmartScreen will warn on first run; see docs/release.md."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))

          # Newest signtool wins: older ones cannot do RFC-3161 timestamping.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                      -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner."; exit 1 }

          # Timestamping is not optional: without it every signature turns
          # invalid the day the certificate expires, including on copies people
          # already downloaded.
          $stamps = @(
            "http://timestamp.digicert.com",
            "http://timestamp.sectigo.com",
            "http://timestamp.globalsign.com/tsa/r6advanced1"
          )

          foreach ($exe in (Get-ChildItem dist\*.exe)) {
            $signed = $false
            foreach ($ts in $stamps) {
              & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD `
                  /fd SHA256 /tr $ts /td SHA256 /d "Relay" $exe.FullName
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              Write-Host "::warning::Timestamp authority $ts did not answer; trying the next one."
            }
            if (-not $signed) { Write-Error "Failed to sign $($exe.Name)."; exit 1 }

            # Verify rather than trust the exit code: /pa checks the chain the
            # way Windows itself will when the user double-clicks it.
            & $signtool.FullName verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "Signature on $($exe.Name) did not verify."; exit 1 }
          }

          Remove-Item $pfx -Force
          Write-Host "Signed and verified $((Get-ChildItem dist\*.exe).Count) installer(s)."

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start install-matrix.yml once the release exists. Without it the
      # dispatch is refused and the release ships unverified.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          # The installers are unsigned, so this is the only integrity check a
          # user has. Not optional.
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          VERSION=${{ needs.version.outputs.version }}
          PREV=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v "^v$VERSION$" | head -1)
          RANGE=$([ -n "$PREV" ] && echo "$PREV..HEAD" || echo "HEAD")
          {
            echo "## Relay $VERSION"
            echo
            echo "Share your phone's connection with your PC. Scan a QR code. That's the setup."
            echo
            echo "### Download"
            echo
            echo "| Platform | File | Requirements |"
            echo "|---|---|---|"
            echo "| **Windows** | \`Relay-Setup-x64.exe\` | Windows 10/11. Per-user install, no admin prompt. |"
            echo "| Windows (32-bit) | \`Relay-Setup-x86.exe\` | Only if you know you need it. |"
            echo "| **Android** | \`Relay-android-arm64-v8a.apk\` | Android 8.0+, 64-bit ARM — almost every phone since 2017. |"
            echo "| Android (any device) | \`Relay-android-universal.apk\` | Same app, every CPU type. Larger. Use this if the one above says \"app not compatible\". |"
            echo "| Android (stores) | \`Relay-android.aab\` | Not directly installable. |"
            echo
            echo "### Install"
            echo
            echo "1. Install both apps."
            echo "2. On the phone, turn on the hotspot (or put both devices on the same Wi-Fi) and tap **Start Sharing**."
            echo "3. On the PC, click **Scan QR** and hold the phone up to the webcam - or **Enter Code Manually**."
            echo
            echo "Windows SmartScreen warns on first run because the installer is not"
            echo "code-signed yet: **More info -> Run anyway**. See \`docs/release.md\`."
            echo
            echo "If Android says **\"App not installed\"**, that one message covers"
            echo "several unrelated causes. The two most common: an older copy built"
            echo "from source is still installed (uninstall it first - a different"
            echo "signing key blocks the upgrade), or Play Protect blocked the"
            echo "sideload (**Install anyway** in its dialog)."
            echo "[docs/install-troubleshooting.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install-troubleshooting.md)"
            echo "covers the rest, starting with how to see the platform's real error."
            echo
            echo "### Verify your download"
            echo
            echo "\`SHA256SUMS.txt\` is attached."
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS.txt'
            echo '```'
            echo
            echo "### Security"
            echo
            echo "Relay's transport is an unauthenticated SOCKS5 proxy: safe on your own"
            echo "hotspot, an open proxy on a shared network. [SECURITY.md](https://github.com/Mahdi-mortazavi/relay/blob/main/SECURITY.md)"
            echo "has the full threat model."
            echo
            echo "### Changes"
            echo
            git log $RANGE --no-merges --pretty='- %s' | head -60
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Upload dry-run artifacts
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/*

      - name: Create GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target so a dispatch-triggered release tags the commit it built
          # from; gh creates the tag when it does not already exist.
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Relay ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      # A release published with GITHUB_TOKEN raises no `release` event -- that
      # is deliberate on GitHub's side, to stop workflows triggering each other
      # in a loop. So install-matrix.yml, which subscribes to that event, never
      # ran for a release this workflow created: it claimed to check every
      # release and checked none of them. Start it here instead, where the
      # release definitely exists.
      - name: Check the published APKs install on real Android versions
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run install-matrix.yml \
            --ref "$GITHUB_REF_NAME" \
            -f tag="v${{ needs.version.outputs.version }}"
          echo "Install matrix started for v${{ needs.version.outputs.version }}."
