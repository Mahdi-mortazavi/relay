# CI is the ONLY build system for this project (ADR-0004): there is no local
# toolchain. Both jobs must stay green at all times and are required checks
# for merging into main. Debug artifacts are uploaded from every run so a
# testable build is always downloadable without cutting a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Full Mode endpoint (/wg). Its own job because it proves the thing that
  # is hardest to be sure of -- that a WireGuard tunnel terminates and its
  # traffic reaches the internet -- and it does that in a process, with no
  # device involved. If this is red, Full Mode does not work, whatever the
  # Android build says.
  wireguard:
    name: Full Mode endpoint (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wg
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # golang.org/x/mobile requires 1.25; pinning it here rather than
          # letting the toolchain directive download one mid-job.
          go-version: '1.25'
          cache-dependency-path: wg/go.sum

      - name: Vet
        run: |
          # Two passes. The Windows client cannot even be parsed on Linux -- it
          # imports golang.org/x/sys/windows -- so vetting as Windows is what
          # actually covers every package; the native pass is what checks the
          # endpoint the way it is built for Android.
          GOOS=windows go vet ./...
          go vet .
          # gofmt is not cosmetic here: this package is read by whoever is
          # debugging a tunnel that will not come up, and two files had already
          # drifted before anyone checked.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi

      # Numbers, not opinions. The packet path and the splice both run on a
      # phone's one bottleneck CPU, and a regression there is invisible to every
      # other job in this file -- the suite stays green while the tunnel gets
      # slower, which is how a read path that leaked a pooled buffer per packet
      # survived several releases.
      #
      # No -race: it changes allocation behaviour and multiplies timings, so a
      # benchmark run under it measures the detector. allocs/op is the number to
      # watch; ns/op on a shared runner is noisy.
      - name: Benchmark the packet path
        run: go test -run '^$' -bench . -benchmem -count=3 .

      - name: Test the tunnel end to end
        # -race because the forwarders, the packet pump and teardown all touch
        # the same endpoint from different goroutines, and a data race there
        # would show up in the field as an occasional dead tunnel.
        #
        # The endpoint package only: the client's tests need a Windows machine
        # and Administrator, and run in the E2E workflow instead.
        run: go test -race -count=1 .

      # The same script a developer runs, so the library the app ships is built
      # the way the one on a desk is. The NDK comes from the runner image; an
      # action that downloads another one restored a half-extracted copy from
      # its cache -- clang itself was missing -- and the bind failed after the
      # tests had already passed, which reads as "the endpoint is broken" when
      # the endpoint was fine.
      - name: Build the Android library
        working-directory: .
        run: scripts/build-wg-aar.sh

      # Android 15 can run with 16 KB memory pages, and a shared library whose
      # segments are aligned for 4 KB simply will not load there: the app
      # installs, then dies on first use of Full Mode. Emulator images still
      # use 4 KB pages, so no test in this repo would notice. Checking the
      # ELF headers does.
      - name: Check the native libraries are 16 KB aligned
        working-directory: .
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          unzip -q android/app/libs/relaywg.aar -d "$work"
          readelf=$(command -v readelf || echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf")
          status=0
          while IFS= read -r so; do
            # 64-bit ABIs only. 32-bit Android has no 16 KB page mode, and armv7
            # is built with 4 KB alignment by design.
            case "$so" in *"/arm64-v8a/"*|*"/x86_64/"*) ;; *) continue ;; esac
            aligns="$("$readelf" -lW "$so" | awk '$1=="LOAD" {print $NF}')"
            for align in $aligns; do
              if [ "$align" != "0x4000" ] && [ "$align" != "0x10000" ]; then
                echo "::error::$(basename "$(dirname "$so")")/$(basename "$so") has LOAD alignment $align; 16 KB devices need 0x4000 or more"
                status=1
              fi
            done
            echo "$(basename "$(dirname "$so")")/$(basename "$so"): $aligns"
          done < <(find "$work" -name '*.so')
          exit $status

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: relaywg-aar
          path: android/app/libs/relaywg.aar
          if-no-files-found: error

  android:
    name: Android (build + test)
    runs-on: ubuntu-latest
    # Waits on the Go job for the Full Mode library. Costs a couple of minutes
    # of wall clock and buys the thing this project kept getting wrong: the APK
    # under test is the APK that ships, Full Mode included.
    needs: wireguard
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Take the Full Mode library
        uses: actions/download-artifact@v8
        with:
          name: relaywg-aar
          path: android/app/libs

      - name: Build and run unit tests
        # -PrelayRequireWg: fail rather than quietly build an app without Full
        # Mode. The download above can succeed and leave nothing usable behind.
        run: ./gradlew assembleDebug testDebugUnitTest -PrelayRequireWg=true

      - name: The suites that matter must have run
        # Gradle prints test names only on failure, so a green run says nothing
        # about which classes executed -- a class that stopped being picked up
        # looks exactly like a class that passed. Same discipline as
        # device-tests.sh and the Full Mode client job; keep the list current
        # when adding a suite that matters.
        run: |
          # Relative to this job's working-directory, which is android/.
          reports=app/build/test-results/testDebugUnitTest
          if [ ! -d "$reports" ]; then
            echo "::error::no test results at $reports — the suite did not run"
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$reports"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "test classes: $(ls -1 "$reports"/*.xml | wc -l), tests: $total"
          for class in \
            PairingServerTest \
            BeaconProbeTest \
            QrPayloadCodecTest \
            ConnectionRulesTest \
            ReconnectPolicyTest
          do
            if [ ! -f "$reports/TEST-io.relay.app.$class.xml" ]; then
              echo "::error::$class did not run — this job proves nothing without it"
              exit 1
            fi
          done
          echo "All required unit-test classes ran."

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: relay-android-debug-apk
          # ABI split names the file app-arm64-v8a-debug.apk; glob covers both.
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Tell GitHub what the Android app actually depends on.
  #
  # Dependabot has two halves and only one of them was working here. Version
  # updates read the manifests directly, which is why the toolchain bumps have
  # been arriving as pull requests all along. Security alerts read the
  # *dependency graph* instead -- and GitHub does not build that from a Gradle
  # version catalog, so all twenty-four Android dependencies were invisible to
  # it. The graph held Go, NuGet and Actions packages and not one Gradle one,
  # which meant a published CVE in anything the app ships could not have raised
  # an alert.
  #
  # This resolves the real build and submits what it found. Push to main only:
  # the submission needs write access to the graph, which a pull request from a
  # fork does not have, and the graph should track what is shipping rather than
  # what someone is proposing.
  dependency-graph:
    name: Android dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: wireguard
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Take the Full Mode library
        # The build does not configure without it, and a dependency graph
        # submitted from a build that failed to configure is an empty one.
        uses: actions/download-artifact@v8
        with:
          name: relaywg-aar
          path: android/app/libs

      - name: Resolve and submit
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android

  windows:
    name: Windows (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # WinUI 3 projects need Visual Studio MSBuild: the PRI packaging tasks
      # (ExpandPriContent) are not shipped with the dotnet CLI's MSBuild.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build app (x64)
        run: msbuild windows/Relay.App/Relay.App.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Run unit tests
        run: dotnet test windows/Relay.App.Tests/Relay.App.Tests.csproj -c Release

      - name: Upload debug build
        uses: actions/upload-artifact@v7
        with:
          name: relay-windows-debug-build
          path: windows/Relay.App/bin/x64/Release/net8.0-windows10.0.19041.0/
          if-no-files-found: error
