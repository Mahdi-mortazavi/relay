<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 52" width="236" height="52" role="img"
     aria-label="Watch the film">
  <!--
    The third button in the header row, drawn to the same 236x52 shape as the
    two download buttons so the row stays one row.

    It is deliberately the quiet one. The two buttons beside it are the things
    a visitor actually came for; this one is for the visitor who has not
    decided yet and wants to see the thing move first. Graphite rather than a
    brand colour, with the play glyph carrying the only accent.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2836"/>
      <stop offset="100%" stop-color="#0D1721"/>
    </linearGradient>
  </defs>
  <rect width="236" height="52" rx="11" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="235" height="51" rx="10.5" fill="none" stroke="#2C3D4E"/>
  <circle cx="60" cy="26" r="13" fill="none" stroke="#4ADFBF" stroke-width="2"/>
  <polygon points="56,19.5 56,32.5 67,26" fill="#4ADFBF"/>
  <text x="130" y="32" text-anchor="middle"
        font-family="'Segoe UI', Inter, system-ui, sans-serif"
        font-size="16" font-weight="600" fill="#FFFFFF">Watch the film</text>
</svg>
