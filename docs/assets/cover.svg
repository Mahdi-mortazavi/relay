<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Relay — share your phone's internet with your PC over an encrypted WireGuard tunnel. اینترنت گوشی‌ات را با کامپیوترت به اشتراک بگذار.">

  <title>Relay — share your phone's internet with your PC</title>
  <desc>Android to Windows reverse tethering over an encrypted WireGuard tunnel. No root, no account, no server.</desc>

  <!--
    Everything here is visible at rest.

    The banner this replaces animated its text in with `animation: … both`, whose
    start state is opacity 0. Any renderer that does not run those CSS
    animations therefore held every word at zero opacity forever — and that is
    not a hypothetical: rasterised here, the hero image of a project with 168
    stars was a blurry gradient and nothing else.

    So motion is decoration only. Strip every <animate> from this file and it
    still reads correctly; that is the test it has to pass.
  -->

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#0B1017"/>
      <stop offset="0.55" stop-color="#070B11"/>
      <stop offset="1"    stop-color="#04060A"/>
    </linearGradient>

    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ADFBF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4ADFBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E7DFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2E7DFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EAF6F2"/>
      <stop offset="1"   stop-color="#9FEBD8"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4ADFBF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ADFBF" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#2E7DFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="screenFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#12303A"/>
      <stop offset="1" stop-color="#0A1A22"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <style>
      .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display",
                        "Vazirmatn", "Noto Sans Arabic", Tahoma, Arial, sans-serif; }
      /* No animation drives opacity or position of anything that carries meaning. */
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#ground)"/>

  <!-- Ambient light. Decorative, and low enough not to fight the type. -->
  <g filter="url(#soft)" opacity="0.9">
    <ellipse cx="215" cy="150" rx="240" ry="170" fill="url(#glowMint)"/>
    <ellipse cx="1010" cy="300" rx="250" ry="175" fill="url(#glowBlue)"/>
  </g>

  <!-- Hairline frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- ================= Left: identity ================= -->
  <g class="t">
    <!-- Mark: the relay arc, echoing the app icon -->
    <g transform="translate(96, 96)">
      <rect x="0" y="0" width="72" height="72" rx="20"
            fill="#0E1A20" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <path d="M20 46 C20 30, 32 22, 44 22 L52 22" fill="none"
            stroke="#4ADFBF" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M45 14 L55 22 L45 30" fill="none"
            stroke="#4ADFBF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="50" r="5.5" fill="#2E7DFF"/>
    </g>

    <text x="192" y="150" font-size="76" font-weight="700" letter-spacing="-2.6"
          fill="url(#wordGrad)">Relay</text>

    <text x="196" y="196" font-size="25" font-weight="500" letter-spacing="-0.2"
          fill="#DCEBF7" fill-opacity="0.82">Share your phone’s internet with your PC.</text>

    <text x="196" y="234" font-size="23" font-weight="500"
          fill="#CFE4F5" fill-opacity="0.62">اینترنت گوشی‌ات را با کامپیوترت به اشتراک بگذار.</text>

    <!-- Capability pills -->
    <g font-size="15" font-weight="600" letter-spacing="0.2">
      <g>
        <rect x="196" y="272" width="132" height="34" rx="17"
              fill="#FFFFFF" fill-opacity="0.06" stroke="url(#glassEdge)"/>
        <text x="262" y="294" text-anchor="middle" fill="#EAF4FF" fill-opacity="0.88">WireGuard</text>
      </g>
      <g>
        <rect x="338" y="272" width="112" height="34" rx="17"
              fill="#FFFFFF" fill-opacity="0.06" stroke="url(#glassEdge)"/>
        <text x="394" y="294" text-anchor="middle" fill="#EAF4FF" fill-opacity="0.88">No root</text>
      </g>
      <g>
        <rect x="460" y="272" width="122" height="34" rx="17"
              fill="#FFFFFF" fill-opacity="0.06" stroke="url(#glassEdge)"/>
        <text x="521" y="294" text-anchor="middle" fill="#EAF4FF" fill-opacity="0.88">No server</text>
      </g>
      <g>
        <rect x="592" y="272" width="150" height="34" rx="17"
              fill="#4ADFBF" fill-opacity="0.13" stroke="#4ADFBF" stroke-opacity="0.34"/>
        <text x="667" y="294" text-anchor="middle" fill="#8FF0DA">TCP + UDP</text>
      </g>
    </g>

    <text x="196" y="352" font-size="14.5" font-weight="500" letter-spacing="0.25"
          fill="#BFD6EA" fill-opacity="0.42">Android → Windows · open source · nothing leaves your two devices</text>
  </g>

  <!-- ================= Right: the actual story ================= -->
  <g transform="translate(768, 116)">

    <!-- Phone -->
    <g>
      <rect x="0" y="0" width="86" height="164" rx="16"
            fill="#0D1620" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <rect x="7" y="9" width="72" height="146" rx="10" fill="url(#screenFill)"/>
      <circle cx="43" cy="26" r="3" fill="#4ADFBF"/>
      <text class="t" x="43" y="88" text-anchor="middle" font-size="30" font-weight="700"
            fill="#8FF0DA">11</text>
      <rect x="24" y="104" width="38" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
      <rect x="18" y="118" width="50" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.10"/>
    </g>

    <!-- Tunnel -->
    <g>
      <line x1="98" y1="82" x2="196" y2="82" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
      <line x1="98" y1="82" x2="196" y2="82" stroke="url(#beam)" stroke-width="2.5"/>
      <!-- Decoration only: the line above is already drawn at rest. -->
      <circle class="pulse" cx="112" cy="82" r="3.4" fill="#4ADFBF">
        <animate attributeName="cx" values="106;190;106" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text class="t" x="147" y="66" text-anchor="middle" font-size="12" font-weight="600"
            letter-spacing="1.1" fill="#7FE6CE" fill-opacity="0.75">ENCRYPTED</text>
    </g>

    <!-- Laptop -->
    <g transform="translate(206, 22)">
      <rect x="0" y="0" width="164" height="104" rx="12"
            fill="#0D1620" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <rect x="9" y="9" width="146" height="86" rx="7" fill="url(#screenFill)"/>
      <circle cx="30" cy="30" r="4" fill="#4ADFBF"/>
      <rect x="42" y="26" width="68" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="20" y="50" width="120" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.10"/>
      <rect x="20" y="66" width="92" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="-16" y="110" width="196" height="9" rx="4.5"
            fill="#101B24" stroke="url(#glassEdge)" stroke-width="1"/>
    </g>
  </g>
</svg>
